name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API, graph and domain core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_ENV: test
      LLM_FAKE: "true"
      GRAPH_WRITER: inline
      SANCTIONS_SOURCE: bundled
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (pinned lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check . ../scripts
          python -m ruff format --check . ../scripts
      - name: Typecheck
        run: python -m mypy .
      - name: Migrations are complete and apply cleanly
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Graph engine smoke (ADR 0001)
        run: python ../scripts/graph_smoke.py ladybug
      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing:skip-covered
      - name: Demo seed runs offline
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          if python manage.py help seed_demo >/dev/null 2>&1; then python manage.py seed_demo; else echo "seed_demo not implemented yet"; fi
      - name: Evaluation gates
        run: |
          if [ -f ../eval/run.py ]; then python ../eval/run.py; else echo "eval harness not implemented yet"; fi

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build
